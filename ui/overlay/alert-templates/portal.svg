      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" rx="48" fill="#0f172a" opacity="0.15"/>
